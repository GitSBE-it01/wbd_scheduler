[package]
name = "wbd_scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
envy = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "mysql",
    "runtime-tokio",
    "tls-native-tls",
] }
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "std"] }
